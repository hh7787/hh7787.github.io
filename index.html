    width: 96%;

  }
  .btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;

  .btn-group a {
    text-decoration: none;
    flex:1 1 140px; /* 最小140px：手机占整行，电脑电视多列 */

  .btn-group button {
    width:100%;

    border: 2px solid #64ffda;
    background-color: #112240;
    color: #64ffda;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .btn-group button:hover {
    background-color: #64ffda;
    color: #0a192f;
  }

  /* 媒体区分：手机/平板/电脑电视 */
  @media screen and (max-width:768px){
    body{
      width:98%;
      padding:0.7rem;
    }
    .btn-group a{
      flex:1 1 100%; /* 手机按钮单独一行铺满 */

  }
  @media screen and (min-width:1400px){
    /* 大屏智能电视优化 */
